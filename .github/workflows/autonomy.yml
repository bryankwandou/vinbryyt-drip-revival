name: Project Chronos Autonomy

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  autonomous-cycle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install groq requests python-dotenv

      - name: Check Timing & Execute
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          MINUTE=$(date +%-M)
          if [ "$MINUTE" -le 15 ] || [ "$MINUTE" -ge 45 ]; then
            echo "🚀 Executing Hourly Image Drop..."
            python src/engine.py image
          else
            echo "📝 Executing Social Post..."
            python src/engine.py post
          fi

      - name: Commit & Push Changes
        run: |
          git config --global user.name "Project Chronos"
          git config --global user.name "chronos-bot@vinbryyt.revival"
          git add .
          git commit -m "🤖 [AUTONOMOUS] Project Chronos: New Revival Drop/Post [skip ci]" || echo "No changes to commit"
          git push origin master:main --force
