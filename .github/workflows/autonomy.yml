name: Project Chronos Autonomy

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  autonomous-cycle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install groq requests python-dotenv

      - name: Check Timing & Execute
        id: cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Without credentials the cycle cannot do anything useful. Skip the
          # run instead of failing it, so a missing secret does not mail out a
          # red run every half hour.
          if [ -z "$GROQ_API_KEY" ] || [ -z "$HF_TOKEN" ]; then
            echo "::warning title=Chronos idle::GROQ_API_KEY or HF_TOKEN is not set; skipping this cycle."
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          MINUTE=$(date +%-M)
          if [ "$MINUTE" -le 15 ] || [ "$MINUTE" -ge 45 ]; then
            echo "🚀 Executing Hourly Image Drop..."
            python src/engine.py image
          else
            echo "📝 Executing Social Post..."
            python src/engine.py post
          fi

      - name: Commit & Push Changes
        if: steps.cycle.outputs.ran == 'true'
        run: |
          git config --global user.name "Project Chronos"
          git config --global user.email "chronos-bot@vinbryyt.revival"
          git add .
          git commit -m "🤖 [AUTONOMOUS] Project Chronos: New Revival Drop/Post [skip ci]" || echo "No changes to commit"
          git push origin main:main
